[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-acquisition"
version = "0.1.0"
description = "AURA UI-mediated acquisition research runtime"
requires-python = ">=3.13"
dependencies = [
  "adbutils==2.12.0",
  "uiautomator2==3.5.0",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
windows = ["pywinauto==0.6.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
